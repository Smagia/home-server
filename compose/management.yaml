services:
  portainer:
    image: portainer/portainer-ce
    container_name: portainer
    environment:
      - TZ=${TZ:-Etc/UTC}
    ports:
      - "8088:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BASE_DIR}/ContainerData/portainer:/data
    restart: unless-stopped

  file-browser:
    image: filebrowser/filebrowser
    container_name: file-browser
    user: root
    environment:
      - TZ=${TZ:-Etc/UTC}
    ports:
      - "8089:80"
    volumes:
      - ${BASE_DIR}/ContainerData/filebrowser:/config
      - ${BASE_DIR}:/srv
    restart: unless-stopped
