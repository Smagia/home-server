    link: "#3273dc"
    link-hover: "#ffdd57"

services:
  - name: "Management"
    icon: "fas fa-tools"
    items:
      - name: "Portainer"
        subtitle: "Docker management"
        url: "http://localhost:8088"
        icon: "fas fa-cubes"
