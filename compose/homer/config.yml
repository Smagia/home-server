      - name: "Transmission"
        subtitle: "BitTorrent client"
        url: "http://localhost:8090"
        icon: "fas fa-download"
        tag: "media"
      - name: "Jellyfin"
        subtitle: "Media streaming"
        url: "http://localhost:8091"
        icon: "fas fa-play-circle"
        tag: "media"
      - name: "Calibre Web"
        subtitle: "eBook library"
